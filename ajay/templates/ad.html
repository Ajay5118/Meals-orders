<!-- myapp/templates/ads_page.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ads Page - My Django Site</title>
</head>
<body>
    <header>
        <h1>Ads Page</h1>
    </header>

    <!-- Google AdSense Code Here -->
    <!-- ad.html -->
<div id="ad-container">
  <!-- Paste the ad code provided by Google AdSense here -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5086407845539146"
     crossorigin="anonymous"></script>
  <ins class="adsbygoogle"
       style="display:inline-block;width:728px;height:90px"
      data-ad-client="YOUR_PUBLISHER_ID"
       data-ad-slot="YOUR_AD_SLOT_ID"></ins>
  <script>
  (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>


    <!-- Additional Content -->
    <div class="content">
        <p>This is a page that contains Google Ads.</p>
    </div>

    <footer>
        <p>© 2024 My Django Site</p>
    </footer>
</body>
</html>
