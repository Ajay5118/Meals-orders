<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Login</title>
<style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align : center;
            display: block;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button[type="submit"] {
            background-color: #54b068;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #469d5d;
        }
</style>
</head>
<body>
    <h1>Login with Phone Number</h1>
    <form id="phone-form" action="{% url 'generate-otp' %}" method="POST">
        {% csrf_token %}
        <label for="first_name">enter the name</label>
        <input type="text" id="first_name" name="first_name" required>
        <label for="phone_number">phoneNumber</label>
        <input type="text" id="phone_number" name="phone_number" required>
        <button type="submit" onclick="location.href='{% url 'validateotp' %}'" >Send OTP</button>
    </form>
  <!--<div id="otp-validate-form" style="display: none;">
        <h2>Validate OTP</h2>
        <form id="validate-otp-form">
            {% csrf_token %}
            <input type="hidden" id="pk" name="pk">
            <label for="otp">Enter OTP:</label>
            <input type="text" id="otp" name="otp" required>
            <button type="button" onclick="validateOtp()">Validate OTP</button>
        </form>
    </div>
    -->


</body>
</html>
